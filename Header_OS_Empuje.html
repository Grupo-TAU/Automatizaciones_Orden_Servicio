    padding-right: 10px;

    height: 42px;
    width: auto;
    display: inline-block;
    vertical-align: middle;
  }
  .header-title {

    font-weight: 700;
    font-size: 24px;
    letter-spacing: .04em;
    text-transform: uppercase;
    line-height: 1.2;

  }

    font-weight: 400;
