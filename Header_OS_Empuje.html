<title>Header OS — Hoja extra</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Barlow', Arial, sans-serif;
    background: #ffffff;
    color: #2c3e50;
    font-size: 12px;
  }

  .page {
    position: relative;
    width: 100%;
    background: #ffffff;
  }

  .header-table {
    width: 100%;
    border-collapse: collapse;
    background-color: rgb(50, 84, 35);
    color: #ffffff;
    height: 64px;
  }
  .header-table td {
    padding: 0 18px;
    vertical-align: middle;
  }
  .header-table td.logo-cell {
    width: 130px;
    text-align: right;
    padding-right: 16px;
  }
  .header-table td.logo-cell img {
    height: 42px;
    width: auto;
    max-width: 120px;
    display: inline-block;
    vertical-align: middle;
  }
  .header-table td.empuje-cell {
    width: 75px;
    text-align: right;
    padding-right: 10px;
  }
  .header-table td.empuje-cell img {
    height: 60px;
    width: auto;
    display: inline-block;
    vertical-align: middle;
  }
  .header-title {
    font-family: 'Barlow Condensed', Arial Narrow, sans-serif;
    font-weight: 700;
    font-size: 24px;
    letter-spacing: .04em;
    text-transform: uppercase;
    line-height: 1.2;
    color: #ffffff;
  }
  .header-title span {
    font-weight: 400;
    font-size: 21px;
    letter-spacing: .06em;
    opacity: .75;
    display: block;
  }
</style>
